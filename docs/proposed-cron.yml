# Scheduled jobs for DayDreamHub.
#
# WHY THIS FILE EXISTS
# Cloudflare Pages has no cron triggers, so the /api/cron/* endpoints are just
# URLs — they run only when something calls them. Nothing calls them today, so
# the owner reminders will never fire until this workflow (or any other
# scheduler) exists.
#
# HOW TO ADD IT
# It cannot be pushed with the current PAT (repo scope only, no workflow scope).
# Add it through the GitHub web UI as .github/workflows/cron.yml, and register a
# repository secret named CRON_SECRET holding the same value that is set on the
# Cloudflare Pages project.
#
# SAFETY
# The reminder endpoint records each (booking, stage) before the next run, so
# running hourly — or twice by accident — sends nothing extra. It also accepts
# ?dry_run=1, which reports who would be emailed and writes nothing.

name: Scheduled jobs

on:
  schedule:
    - cron: '17 * * * *'      # hourly, off the hour to dodge the platform-wide rush
  workflow_dispatch:

jobs:
  owner-booking-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Chase owners who have not answered a booking (6h / 12h / 24h)
        run: |
          curl -sS -X POST 'https://daydreamhub.com/api/cron/booking-reminders' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w '\nHTTP %{http_code}\n' \
            --fail-with-body

# ---------------------------------------------------------------------------
