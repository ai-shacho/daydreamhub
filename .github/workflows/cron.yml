# Scheduled jobs for DayDreamHub.
#
# WHY THIS FILE EXISTS
# Cloudflare Pages has no cron triggers, so the /api/cron/* endpoints are just
# URLs — they run only when something calls them. Nothing calls them today, so
# the owner reminders will never fire until this workflow (or any other
# scheduler) exists.
#
# HOW TO ADD IT
# It cannot be pushed with the current PAT (repo scope only, no workflow scope).
# Add it through the GitHub web UI as .github/workflows/cron.yml.
# The CRON_SECRET repository secret is already registered, and its value matches
# the CRON_SECRET on the Cloudflare Pages production environment.
#
# DRY RUN SWITCH
# The repository variable REMINDER_DRY_RUN controls whether this actually sends.
#   REMINDER_DRY_RUN = 1  → calls the endpoint with ?dry_run=1: the run logs who
#                           would be emailed and writes nothing. This is the
#                           current setting.
#   REMINDER_DRY_RUN = 0  → live sending.
# It is a variable rather than a line in this file so the switch can be flipped
# from Settings → Secrets and variables → Actions → Variables, with no edit here.
#
# SAFETY
# The endpoint records each (booking, stage) before the next run, so running
# hourly — or twice by accident — sends nothing extra. Bookings that predate the
# feature are excluded outright by migration 054.

name: Scheduled jobs

on:
  schedule:
    - cron: '17 * * * *'      # hourly, off the hour to dodge the platform-wide rush
  workflow_dispatch:
    inputs:
      suppress:
        description: 'Booking ids to silence without emailing, e.g. 79,81. Leave blank for a normal run.'
        required: false
        default: ''

jobs:
  owner-booking-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Chase owners who have not answered a booking (6h / 12h / 24h)
        env:
          DRY_RUN: ${{ vars.REMINDER_DRY_RUN }}
          SUPPRESS: ${{ github.event.inputs.suppress }}
        run: |
          URL='https://daydreamhub.com/api/cron/booking-reminders'
          SEP='?'
          if [ "$DRY_RUN" != "0" ]; then
            echo "REMINDER_DRY_RUN=${DRY_RUN:-unset} — reporting only, nothing will be sent."
            URL="$URL${SEP}dry_run=1"; SEP='&'
          fi
          # Bookings made while testing against a real hotel: record them as
          # reminded and send them nothing. The booking stays open so the hotel
          # can still approve or decline from the email it already has.
          if [ -n "$SUPPRESS" ]; then
            echo "Suppressing booking ids: $SUPPRESS — these will be marked as reminded, not emailed."
            URL="$URL${SEP}suppress=$SUPPRESS"
          fi
          curl -sS -X POST "$URL" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w '\nHTTP %{http_code}\n' \
            --fail-with-body

# ---------------------------------------------------------------------------
# NOT ENABLED: /api/cron/update-booking-status
