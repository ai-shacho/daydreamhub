# Scheduled jobs for DayDreamHub.
#
# WHY THIS FILE EXISTS
# Cloudflare Pages has no cron triggers, so the /api/cron/* endpoints are just
# URLs — they run only when something calls them. Nothing calls them today, so
# the owner reminders will never fire until this workflow (or any other
# scheduler) exists.
#
# HOW TO ADD IT
# It cannot be pushed with the current PAT (repo scope only, no workflow scope).
# Add it through the GitHub web UI as .github/workflows/cron.yml.
# The CRON_SECRET repository secret is already registered, and its value matches
# the CRON_SECRET on the Cloudflare Pages production environment.
#
# DRY RUN SWITCHES
# A repository variable controls whether each job actually acts. Both default to
# a dry run when the variable is missing, so forgetting to set one cannot cause
# an email to be sent or a hotel to be rung.
# REMINDER_DRY_RUN → owner-booking-reminders. 0 = live sending.
# CALL_DRY_RUN → deferred-booking-calls. 0 = live dialling.
# They are variables rather than lines in this file so the switches can be
# flipped from Settings → Secrets and variables → Actions → Variables, with no
# edit here.
#
# SAFETY
# Reminders: the endpoint records each (booking, stage) before the next run, so
# running hourly — or twice by accident — sends nothing extra. Bookings that
# predate the feature are excluded outright by migration 054.
#
# Calls: a queued call is only placed while the booking it is about still lies
# ahead. process-calls has never been on a schedule, so every queued row in
# production has been sitting there since it was written; without that rule the
# first run would ring hotels about stays that came and went. Those rows are
# closed off as 'skipped' instead, with the reason recorded against them.

name: Scheduled jobs

on:
schedule:
- cron: '17 * * * *' # hourly, off the hour to dodge the platform-wide rush
workflow_dispatch:
inputs:
suppress:
description: 'Booking ids to silence without emailing, e.g. 79,81. Leave blank for a normal run.'
required: false
default: ''

jobs:
owner-booking-reminders:
runs-on: ubuntu-latest
steps:
- name: Chase owners who have not answered a booking (6h / 12h / 24h)
env:
DRY_RUN: ${{ vars.REMINDER_DRY_RUN }}
SUPPRESS: ${{ github.event.inputs.suppress }}
run: |
URL='https://daydreamhub.com/api/cron/booking-reminders'
SEP='?'
if [ "$DRY_RUN" != "0" ]; then
echo "REMINDER_DRY_RUN=${DRY_RUN:-unset} — reporting only, nothing will be sent."
URL="$URL${SEP}dry_run=1"; SEP='&'
fi
# Bookings made while testing against a real hotel: record them as
# reminded and send them nothing. The booking stays open so the hotel
# can still approve or decline from the email it already has.
if [ -n "$SUPPRESS" ]; then
echo "Suppressing booking ids: $SUPPRESS — these will be marked as reminded, not emailed."
URL="$URL${SEP}suppress=$SUPPRESS"
fi
curl -sS -X POST "$URL" \
-H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
-w '\nHTTP %{http_code}\n' \
--fail-with-body

deferred-booking-calls:
runs-on: ubuntu-latest
steps:
# A booking that lands between midnight and 5am local is held rather than
# waking the front desk, and nothing has ever placed those held calls.
# This step also refunds guests whose 24 hours to accept an alternative
# hotel have run out.
- name: Place calls held overnight, and refund expired alternative offers
env:
DRY_RUN: ${{ vars.CALL_DRY_RUN }}
run: |
URL='https://daydreamhub.com/api/cron/process-calls'
if [ "$DRY_RUN" != "0" ]; then
echo "CALL_DRY_RUN=${DRY_RUN:-unset} — reporting only. Nothing will be dialled and nothing will be written."
URL="$URL?dry_run=1"
fi
curl -sS -X POST "$URL" \
-H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
-w '\nHTTP %{http_code}\n' \
--fail-with-body

# ---------------------------------------------------------------------------
# NOT ENABLED: /api/cron/update-booking-status
#
# This endpoint already exists and has never once run — production still has 19
# bookings in pending_confirmation whose check-in date has passed, and no
# booking has ever reached completed or no_show. Scheduling it would flip all of
# that backlog in a single run, so it needs a decision of its own rather than
# being switched on as a side effect of the reminders.
#
# To enable it later, add '5 1 * * *' to the schedule above and this job, gated
# so each cron line triggers only its own job:
