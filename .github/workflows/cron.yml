# This endpoint already exists and has never once run — production still has 19
# bookings in pending_confirmation whose check-in date has passed, and no
# booking has ever reached completed or no_show. Scheduling it would flip all of
# that backlog in a single run, so it needs a decision of its own rather than
# being switched on as a side effect of the reminders.
#
